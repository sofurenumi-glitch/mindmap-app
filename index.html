<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#1e293b" />
  <title>MindMap — 初期値は、愛</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='10' fill='%231e293b'/%3E%3Ccircle cx='6' cy='8' r='4' fill='%230284c7'/%3E%3Ccircle cx='6' cy='24' r='4' fill='%23059669'/%3E%3Ccircle cx='26' cy='10' r='4' fill='%23d97706'/%3E%3Ccircle cx='26' cy='22' r='4' fill='%23db2777'/%3E%3C/svg%3E" />
  <script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --text: #0f172a;
      --text-soft: #334155;
      --muted: #64748b;
      --muted-soft: #94a3b8;
      --accent: #0284c7;
      --accent-soft: #e0f2fe;
      --accent-strong: #0369a1;
      --danger: #dc2626;
      --danger-soft: #fef2f2;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.08), 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.1);
      --shadow-lg: 0 12px 28px rgba(15, 23, 42, 0.15);
      --c0: #1e293b;
      --c1: #0284c7;
      --c2: #059669;
      --c3: #d97706;
      --c4: #db2777;
      --c5: #7c3aed;
      --c6: #64748b;
      --r-sm: 6px;
      --r-md: 10px;
      --r-lg: 14px;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
      overscroll-behavior: none;
      font-size: 14px;
    }
    body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

    button {
      font-family: inherit; font-size: 13px; font-weight: 600;
      padding: 8px 12px; border: 1px solid var(--border); background: var(--surface);
      color: var(--text); border-radius: var(--r-md); cursor: pointer;
      transition: background-color .15s ease, border-color .15s ease, transform .05s ease, color .15s ease;
      display: inline-flex; align-items: center; gap: 6px;
      min-height: 36px;
      user-select: none;
      -webkit-user-select: none;
    }
    button:hover { background: #f1f5f9; border-color: var(--border-strong); }
    button:active { transform: translateY(1px); }
    button.primary { background: var(--c1); color: #fff; border-color: var(--c1); }
    button.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
    button.ghost { background: transparent; border-color: transparent; color: var(--muted); }
    button.ghost:hover { background: #f1f5f9; color: var(--text); }
    button.danger { color: var(--danger); border-color: transparent; background: transparent; }
    button.danger:hover { background: var(--danger-soft); }
    button.icon-only { padding: 0; width: 36px; height: 36px; justify-content: center; }
    button.icon-only .label { display: none; }
    button .icon { font-size: 14px; line-height: 1; }
    button.block { width: 100%; justify-content: center; }

    /* ─────────────────────────────────────────
       ヘッダー
       ───────────────────────────────────────── */
    header {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 14px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      flex-wrap: nowrap;
      z-index: 10;
      min-height: 56px;
    }
    header .title-wrap {
      display: flex; align-items: center; gap: 10px;
      flex: 1 1 auto; min-width: 0;
    }
    header .logo {
      width: 36px; height: 36px; border-radius: 9px;
      background: linear-gradient(135deg, var(--c0), var(--c1));
      display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 16px;
      flex-shrink: 0;
      box-shadow: 0 2px 4px rgba(2, 132, 199, 0.25);
    }
    .map-meta { display: flex; flex-direction: column; min-width: 0; line-height: 1.15; flex: 1; }
    .map-title-row { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .map-title {
      font-size: 15px; font-weight: 700; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      cursor: pointer; padding: 3px 8px; margin: -3px -8px;
      border-radius: var(--r-sm); transition: background-color .15s;
      min-width: 0; max-width: 100%;
    }
    .map-title:hover { background: #f1f5f9; }
    .save-indicator {
      font-size: 11px; color: var(--muted); display: inline-flex; align-items: center; gap: 3px;
      flex-shrink: 0;
      opacity: 0; transition: opacity .2s ease;
    }
    .save-indicator.show { opacity: 1; }
    .save-indicator .dot {
      width: 6px; height: 6px; border-radius: 50%; background: var(--c2);
      animation: pulse 1.5s infinite ease-in-out;
    }
    .save-indicator.saved .dot { animation: none; background: var(--c2); }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .map-sub {
      font-size: 11px; color: var(--muted); font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      padding: 0 8px;
    }
    .map-sub span { color: var(--c4); }
    .header-actions { display: flex; gap: 6px; flex-shrink: 0; align-items: center; }

    /* ─────────────────────────────────────────
       メイン
       ───────────────────────────────────────── */
    main {
      flex: 1; display: flex; min-height: 0; position: relative;
      overflow: hidden;
    }

    /* ─────────────────────────────────────────
       サイドバー
       ───────────────────────────────────────── */
    .sidebar {
      width: 300px; flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      transition: margin-left 280ms var(--ease);
      z-index: 20;
      min-height: 0;
    }
    body.sidebar-hidden .sidebar { margin-left: -300px; }

    .sb-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 14px 8px;
    }
    .sb-header-left { display: flex; align-items: baseline; gap: 8px; }
    .sb-header h2 { font-size: 14px; font-weight: 700; margin: 0; color: var(--text); }
    .sb-count {
      font-size: 11px; color: var(--muted); background: var(--bg);
      padding: 2px 8px; border-radius: 999px; font-weight: 600;
    }

    .sb-tools {
      padding: 4px 14px 10px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .sb-search-wrap { position: relative; }
    .sb-search {
      width: 100%; padding: 8px 10px 8px 32px;
      border: 1px solid var(--border); border-radius: var(--r-md);
      font-family: inherit; font-size: 13px;
      background: var(--bg); color: var(--text);
      outline: none;
      transition: border-color .15s, background .15s;
    }
    .sb-search:focus { border-color: var(--c1); background: var(--surface); }
    .sb-search-icon {
      position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
      font-size: 13px; color: var(--muted-soft); pointer-events: none;
    }
    .sb-sort {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid var(--border); border-radius: var(--r-md);
      font-family: inherit; font-size: 12px; font-weight: 600;
      background: var(--surface); color: var(--text);
      cursor: pointer; outline: none;
      appearance: none; -webkit-appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 8px center;
      background-size: 14px;
      padding-right: 28px;
    }

    .sb-new-wrap { padding: 0 14px 10px; }
    .sb-new-btn {
      width: 100%; justify-content: center;
      background: var(--c1); color: #fff; border-color: var(--c1);
      font-weight: 700; font-size: 13px;
      min-height: 40px;
      box-shadow: 0 1px 2px rgba(2,132,199,0.25);
    }
    .sb-new-btn:hover { background: var(--accent-strong); border-color: var(--accent-strong); }

    .sb-list {
      flex: 1; overflow-y: auto; min-height: 0;
      padding: 4px 8px 14px;
      display: flex; flex-direction: column; gap: 2px;
      scrollbar-width: thin;
      scrollbar-color: var(--border-strong) transparent;
    }
    .sb-list::-webkit-scrollbar { width: 6px; }
    .sb-list::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

    .sb-empty {
      text-align: center; color: var(--muted); padding: 28px 14px; font-size: 13px;
      line-height: 1.6;
    }
    .sb-empty .icon { font-size: 32px; display: block; margin-bottom: 8px; opacity: 0.5; }

    .map-item {
      position: relative;
      display: block;
      width: 100%;
      text-align: left;
      padding: 10px 36px 10px 14px;
      border: 1px solid transparent;
      background: transparent;
      border-radius: var(--r-md);
      cursor: pointer;
      transition: background-color .12s ease, border-color .12s ease, transform .05s ease;
      font-family: inherit;
      color: var(--text);
    }
    .map-item:hover { background: var(--bg); }
    .map-item:active { transform: scale(0.99); }
    .map-item.active {
      background: var(--accent-soft);
      border-color: #93c5fd;
    }
    .map-item.active::before {
      content: '';
      position: absolute;
      left: -3px; top: 8px; bottom: 8px;
      width: 3px; border-radius: 0 3px 3px 0;
      background: var(--c1);
    }
    .map-item-title {
      font-size: 13px; font-weight: 600; line-height: 1.4;
      color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 3px;
    }
    .map-item.active .map-item-title { color: #0c4a6e; font-weight: 700; }
    .map-item-meta {
      font-size: 11px; color: var(--muted);
      display: flex; gap: 4px; align-items: center;
      white-space: nowrap;
    }
    .map-item-meta .sep { opacity: 0.5; }
    .map-item.active .map-item-meta { color: #0369a1; }

    .map-item-menu-btn {
      position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
      width: 26px; height: 26px; padding: 0;
      border: none; background: transparent; cursor: pointer;
      border-radius: var(--r-sm);
      font-size: 16px; line-height: 1; color: var(--muted-soft);
      opacity: 0; transition: opacity .12s ease, background-color .12s ease, color .12s ease;
      display: grid; place-items: center;
      min-height: auto;
    }
    .map-item:hover .map-item-menu-btn,
    .map-item.active .map-item-menu-btn { opacity: 1; }
    .map-item-menu-btn:hover { background: rgba(15,23,42,0.08); color: var(--text); }
    @media (hover: none) {
      .map-item-menu-btn { opacity: 0.8; }
    }

    .sb-footer {
      padding: 8px 10px 12px;
      border-top: 1px solid var(--border);
      display: flex; gap: 4px;
      background: linear-gradient(180deg, transparent, rgba(248,250,252,0.5));
    }
    .sb-footer button { flex: 1; font-size: 11px; min-height: 34px; padding: 6px 8px; font-weight: 600; }

    /* コンテキストメニュー */
    .ctx-menu {
      position: fixed;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      box-shadow: var(--shadow-lg);
      padding: 4px;
      z-index: 300;
      min-width: 180px;
      opacity: 0; transform: scale(0.96) translateY(-4px);
      pointer-events: none;
      transition: opacity .12s ease, transform .12s var(--ease);
    }
    .ctx-menu.open { opacity: 1; transform: scale(1) translateY(0); pointer-events: auto; }
    .ctx-menu button {
      width: 100%; justify-content: flex-start;
      background: transparent; border: none;
      padding: 8px 12px; min-height: 36px;
      font-size: 13px; font-weight: 500; color: var(--text);
      border-radius: var(--r-sm);
    }
    .ctx-menu button:hover { background: var(--bg); }
    .ctx-menu button.danger { color: var(--danger); }
    .ctx-menu button.danger:hover { background: var(--danger-soft); }
    .ctx-menu hr {
      border: none; border-top: 1px solid var(--border);
      margin: 4px 0;
    }

    /* バックドロップ（モバイルのみ） */
    .sb-backdrop {
      display: none;
      position: fixed; inset: 0;
      background: rgba(15, 23, 42, 0.4);
      z-index: 15;
      opacity: 0; pointer-events: none;
      transition: opacity 240ms ease;
      backdrop-filter: blur(2px);
    }

    /* ─────────────────────────────────────────
       エディタ
       ───────────────────────────────────────── */
    #editor-pane {
      width: 38%; min-width: 280px;
      display: flex; flex-direction: column;
      border-right: 1px solid var(--border);
      background: var(--surface);
      min-height: 0;
    }
    .editor-header {
      padding: 8px 14px; font-size: 12px; color: var(--muted); font-weight: 600;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .editor-toolbar {
      display: flex; gap: 4px; padding: 6px 8px;
      border-bottom: 1px solid var(--border);
      background: #f8fafc; flex-wrap: wrap;
    }
    .editor-toolbar button { min-height: 40px; padding: 0 12px; font-size: 13px; font-weight: 600; background: var(--surface); }
    .editor-toolbar .spacer { flex: 1; }
    .editor-toolbar .hint { font-size: 11px; color: var(--muted); align-self: center; padding-right: 4px; }

    #editor {
      flex: 1; width: 100%; resize: none; border: none; outline: none;
      padding: 18px 16px;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 16px; line-height: 1.85;
      color: var(--text); background: var(--surface);
      tab-size: 2; -webkit-text-size-adjust: 100%;
    }
    #editor:focus { background: #fefefe; }

    /* ─────────────────────────────────────────
       ビュー
       ───────────────────────────────────────── */
    #view-pane {
      flex: 1; min-width: 0; position: relative; overflow: hidden;
      background: radial-gradient(circle at 1px 1px, #e2e8f0 1px, transparent 0);
      background-size: 24px 24px;
      touch-action: none;
    }
    #mindmap {
      display: block; width: 100%; height: 100%;
      cursor: grab; touch-action: none;
      user-select: none; -webkit-user-select: none;
    }
    #mindmap.panning { cursor: grabbing; }
    #mindmap.node-dragging { cursor: grabbing; }
    #mindmap .node { cursor: pointer; }
    #mindmap .node .node-bg { transition: filter .12s ease; }
    #mindmap .node:hover .node-bg { filter: brightness(1.08); }
    #mindmap .node.selected .node-bg { stroke: #0f172a; stroke-width: 3; }
    #mindmap .node.drag-source .node-bg { opacity: 0.35; }
    #mindmap .node.drop-target .node-bg {
      stroke: #f59e0b; stroke-width: 4;
      filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.55));
    }
    #mindmap .add-btn { cursor: pointer; opacity: 0; transition: opacity .15s; }
    #mindmap .node:hover .add-btn, #mindmap .node.selected .add-btn { opacity: 1; }
    @media (hover: none) { #mindmap .add-btn { opacity: 1; } }
    #mindmap .drag-ghost { pointer-events: none; }

    .zoom-pill {
      position: absolute; right: 12px; bottom: 12px;
      background: rgba(255,255,255,.96); backdrop-filter: blur(10px);
      border: 1px solid var(--border); border-radius: 12px;
      padding: 6px;
      display: flex; gap: 4px; align-items: center;
      box-shadow: var(--shadow-md); z-index: 5;
    }
    .zoom-pill button { min-height: 36px; min-width: 36px; padding: 0 8px; border-color: transparent; background: transparent; }
    .zoom-pill button:hover { background: #f1f5f9; }
    .zoom-pill .zoom-level { min-width: 48px; text-align: center; font-size: 12px; color: var(--muted); font-weight: 600; user-select: none; }

    .status-bar {
      position: absolute; left: 12px; bottom: 12px;
      background: rgba(255,255,255,.92); backdrop-filter: blur(8px);
      border: 1px solid var(--border); border-radius: 10px;
      padding: 6px 10px;
      font-size: 12px; color: var(--muted);
      display: flex; gap: 10px; align-items: center;
      box-shadow: var(--shadow-sm); z-index: 5;
    }
    .status-bar .legend { display: flex; gap: 6px; align-items: center; }
    .status-bar .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

    /* ─────────────────────────────────────────
       トースト
       ───────────────────────────────────────── */
    .toast {
      position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%) translateY(20px);
      background: var(--c0); color: #fff; padding: 10px 18px;
      border-radius: 999px; font-size: 13px; font-weight: 600;
      opacity: 0; pointer-events: none;
      transition: opacity .25s ease, transform .25s var(--ease);
      z-index: 400;
      box-shadow: var(--shadow-lg);
      max-width: 92vw; text-align: center;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ─────────────────────────────────────────
       モバイル
       ───────────────────────────────────────── */
    .mobile-only { display: none !important; }

    @media (max-width: 768px) {
      header { padding: 6px 10px; gap: 6px; min-height: 52px; }
      header .logo { width: 32px; height: 32px; font-size: 14px; }
      .map-title { font-size: 14px; }
      .map-sub { font-size: 10px; }
      button { padding: 7px 10px; font-size: 12px; min-height: 36px; }
      main { flex-direction: column; }

      /* サイドバー：モバイルではドロワー */
      .sidebar {
        position: fixed;
        top: 0; bottom: 0; left: 0;
        width: 84vw; max-width: 360px;
        margin-left: -100%;
        box-shadow: 4px 0 30px rgba(15, 23, 42, 0.2);
        z-index: 100;
      }
      body.sidebar-hidden .sidebar { margin-left: -100%; }
      body.sidebar-shown .sidebar { margin-left: 0; }
      .sb-backdrop { display: block; }
      body.sidebar-shown .sb-backdrop { opacity: 1; pointer-events: auto; }

      .mobile-only { display: inline-flex !important; }
      .desktop-only { display: none !important; }

      #editor-pane { width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
      main.view-mindmap #editor-pane { display: none; }
      main.view-editor #view-pane { display: none; }
      main.view-split #editor-pane { height: 45%; }
      main.view-split #view-pane { height: 55%; }

      #editor { font-size: 17px; line-height: 1.9; padding: 16px 14px; }
      .editor-toolbar button { min-height: 44px; padding: 0 14px; font-size: 14px; }
      .editor-toolbar .hint { display: none; }
      .status-bar { font-size: 11px; left: 8px; bottom: 8px; padding: 5px 8px; }
      .status-bar .legend-text { display: none; }
      .zoom-pill { right: 8px; bottom: 8px; }
      .zoom-pill button { min-height: 44px; min-width: 44px; }

      .map-item { padding: 12px 36px 12px 14px; }
      .map-item-title { font-size: 14px; }
      .map-item-meta { font-size: 11px; }
      .map-item-menu-btn { width: 32px; height: 32px; font-size: 18px; }
    }

    /* ─────────────────────────────────────────
       ダイアログ
       ───────────────────────────────────────── */
    dialog {
      border: none; border-radius: var(--r-lg); padding: 0;
      box-shadow: var(--shadow-lg);
      max-width: 92vw;
    }
    dialog::backdrop { background: rgba(15, 23, 42, .4); backdrop-filter: blur(4px); }
    dialog .dialog-body { padding: 22px 24px; }
    dialog h2 { margin: 0 0 14px; font-size: 16px; }
    dialog .dialog-actions { display: flex; gap: 8px; justify-content: flex-end; }
    dialog .dialog-actions button { min-height: 40px; padding: 0 16px; }

    #dialog-edit { width: 460px; }
    #dialog-edit .dialog-input {
      width: 100%; padding: 12px 14px;
      border: 1px solid var(--border); border-radius: var(--r-md);
      font-size: 16px; font-family: inherit; line-height: 1.6;
      margin-bottom: 8px;
      resize: vertical; min-height: 56px; max-height: 50vh;
    }
    #dialog-edit .dialog-input:focus { outline: none; border-color: var(--c1); box-shadow: 0 0 0 3px rgba(2,132,199,0.15); }
    .dialog-hint {
      font-size: 11px; color: var(--muted); margin-bottom: 14px;
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    .dialog-hint kbd {
      font-family: ui-monospace, Menlo, monospace; font-size: 10px;
      background: var(--bg); border: 1px solid var(--border);
      padding: 1px 6px; border-radius: 4px; color: var(--text);
    }

    #dialog-confirm { width: 380px; }
    #dialog-confirm .confirm-msg { font-size: 14px; line-height: 1.6; margin-bottom: 18px; color: var(--text); }
  </style>
</head>
<body class="sidebar-hidden">

  <header>
    <button id="btn-sidebar" class="ghost icon-only" title="マップ一覧を開閉">
      <span class="icon">📚</span><span class="label">マップ</span>
    </button>
    <div class="title-wrap">
      <div class="logo">M</div>
      <div class="map-meta">
        <div class="map-title-row">
          <div class="map-title" id="map-title" title="クリックでタイトルを編集">マップ</div>
          <div class="save-indicator" id="save-indicator">
            <span class="dot"></span><span class="save-text">保存中</span>
          </div>
        </div>
        <div class="map-sub">MindMap <span>—</span> 初期値は、愛</div>
      </div>
    </div>
    <div class="header-actions">
      <button id="btn-toggle" class="mobile-only ghost icon-only" title="表示切替">
        <span class="icon">⇄</span>
      </button>
      <button id="btn-new" title="新規マップを作成" class="ghost icon-only">
        <span class="icon">＋</span>
      </button>
      <button id="btn-share" class="primary" title="共有URLをコピー">
        <span class="icon">🔗</span><span>共有</span>
      </button>
    </div>
  </header>

  <main class="view-split">

    <aside class="sidebar" id="sidebar">
      <div class="sb-header">
        <div class="sb-header-left">
          <h2>📚 マップ</h2>
          <span class="sb-count" id="sb-count">0</span>
        </div>
        <button id="sb-close" class="ghost icon-only mobile-only" title="閉じる">
          <span class="icon">×</span>
        </button>
      </div>
      <div class="sb-tools">
        <div class="sb-search-wrap">
          <span class="sb-search-icon">🔍</span>
          <input type="search" id="sb-search" class="sb-search" placeholder="マップを検索..." autocomplete="off">
        </div>
        <select id="sb-sort" class="sb-sort">
          <option value="updated">最終更新順</option>
          <option value="created">作成順（新しい順）</option>
          <option value="title">タイトル順（あいうえお）</option>
        </select>
      </div>
      <div class="sb-new-wrap">
        <button id="sb-new" class="sb-new-btn">
          <span class="icon">＋</span><span>新規マップ</span>
        </button>
      </div>
      <div class="sb-list" id="sb-list"></div>
      <div class="sb-footer">
        <button id="sb-import" class="ghost"><span>📥</span><span>取り込み</span></button>
        <button id="sb-export-all" class="ghost"><span>📁</span><span>一括保存</span></button>
      </div>
    </aside>

    <div class="sb-backdrop" id="sb-backdrop"></div>

    <section id="editor-pane">
      <div class="editor-header">
        <span>📝 Markdownエディタ</span>
        <span id="char-count">0 文字</span>
      </div>
      <div class="editor-toolbar">
        <button data-action="outdent" title="アウトデント (Shift+Tab)">⇤</button>
        <button data-action="indent" title="インデント (Tab)">⇥</button>
        <button data-action="newbullet" title="同じ階層に新しい枝を追加">＋ 枝</button>
        <button data-action="newchild" title="子の枝を追加">＋ 子</button>
        <span class="spacer"></span>
        <span class="hint">Enter→自動箇条書き / Tab→深く</span>
      </div>
      <textarea id="editor" spellcheck="false" autocomplete="off" autocapitalize="off"
        placeholder="# 中央のテーマ&#10;&#10;- 大きな枝&#10;  - 小さな枝"></textarea>
    </section>

    <section id="view-pane">
      <svg id="mindmap" xmlns="http://www.w3.org/2000/svg"></svg>

      <div class="status-bar">
        <span id="node-count">0 ノード</span>
        <span style="color:#cbd5e1">|</span>
        <div class="legend">
          <span class="legend-text">階層:</span>
          <span class="dot" style="background:var(--c0)" title="ルート"></span>
          <span class="dot" style="background:var(--c1)" title="L1"></span>
          <span class="dot" style="background:var(--c2)" title="L2"></span>
          <span class="dot" style="background:var(--c3)" title="L3"></span>
          <span class="dot" style="background:var(--c4)" title="L4"></span>
          <span class="dot" style="background:var(--c5)" title="L5"></span>
        </div>
      </div>

      <div class="zoom-pill">
        <button id="btn-zoom-out" title="縮小">−</button>
        <span class="zoom-level" id="zoom-level">100%</span>
        <button id="btn-zoom-in" title="拡大">+</button>
        <button id="btn-zoom-fit" title="全体を表示">⤢</button>
      </div>
    </section>
  </main>

  <input type="file" id="file-input" accept=".md,.markdown,.txt" hidden multiple />
  <div id="toast" class="toast"></div>

  <!-- コンテキストメニュー -->
  <div class="ctx-menu" id="ctx-menu" role="menu"></div>

  <!-- 編集ダイアログ -->
  <dialog id="dialog-edit">
    <div class="dialog-body">
      <h2 id="dialog-title">ノードを編集</h2>
      <textarea id="dialog-input" class="dialog-input" rows="3" spellcheck="false" autocomplete="off"></textarea>
      <div class="dialog-hint">
        <span><kbd>Enter</kbd> 改行 / <kbd>⌘/Ctrl + Enter</kbd> 決定 / <kbd>Esc</kbd> 取消</span>
        <span id="dialog-char-count" style="color:var(--muted);"></span>
      </div>
      <div class="dialog-actions">
        <button id="dialog-cancel">キャンセル</button>
        <button id="dialog-ok" class="primary">OK</button>
      </div>
    </div>
  </dialog>

  <!-- 確認ダイアログ -->
  <dialog id="dialog-confirm">
    <div class="dialog-body">
      <h2 id="confirm-title">確認</h2>
      <div class="confirm-msg" id="confirm-msg"></div>
      <div class="dialog-actions">
        <button id="confirm-cancel">キャンセル</button>
        <button id="confirm-ok" class="primary">OK</button>
      </div>
    </div>
  </dialog>

  <script>
    'use strict';
    const SVG_NS = 'http://www.w3.org/2000/svg';

    // ════════════════════════════════════════════════════
    // 1. 色パレット
    // ════════════════════════════════════════════════════
    const COLORS = ['#1e293b','#0284c7','#059669','#d97706','#db2777','#7c3aed','#64748b'];
    const colorFor = d => COLORS[Math.min(d, COLORS.length - 1)];

    // ════════════════════════════════════════════════════
    // 2. サンプル
    // ════════════════════════════════════════════════════
    const SAMPLE = `# 想夫恋 宇美店

- 数字（経営）
  - F0回収日数 16日
  - 粗利率 50〜60%
  - 月商 200万
- 商品
  - 焼そば
  - ふりかけ（店外拡張）
  - 食事券
- 想い
  - 初期値は、愛
  - 循環する設計
  - 気持ちの行き先
- 並走プロジェクト
  - BOOKS Terminal
  - Fukuoka connect
  - うみまち
`;

    const BLANK_TEMPLATE = `# 新しいマップ

- 最初の枝
`;

    // ════════════════════════════════════════════════════
    // 3. DOM参照
    // ════════════════════════════════════════════════════
    const editor = document.getElementById('editor');
    const svg = document.getElementById('mindmap');
    const main = document.querySelector('main');
    const mapTitleEl = document.getElementById('map-title');
    const saveIndicator = document.getElementById('save-indicator');
    const saveText = saveIndicator.querySelector('.save-text');
    const sbList = document.getElementById('sb-list');
    const sbSearch = document.getElementById('sb-search');
    const sbSort = document.getElementById('sb-sort');
    const sbCount = document.getElementById('sb-count');
    const ctxMenu = document.getElementById('ctx-menu');

    // ════════════════════════════════════════════════════
    // 4. 状態
    // ════════════════════════════════════════════════════
    let tree = null;
    let allNodes = [];
    let selectedNodeId = null;
    let canvasG = null;
    let ghostG = null;
    const view = { scale: 1, tx: 0, ty: 0 };
    let dragState = null;
    const pointers = new Map();

    let library = null;
    let currentMap = null;
    let mutedSave = false;
    let searchQuery = '';
    let sortMode = 'updated';

    // ════════════════════════════════════════════════════
    // 5. ライブラリ
    // ════════════════════════════════════════════════════
    const LIB_KEY = 'mindmap.library.v2';
    const LEGACY_KEY = 'mindmap.draft.v1';
    const PREFS_KEY = 'mindmap.prefs.v1';

    function freshId() {
      return 'm_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
    }
    function nowTs() { return Date.now(); }
    function titleOf(md) {
      const m = md.match(/^#\s+(.+?)\s*$/m);
      return m ? m[1].trim() : '無題のマップ';
    }
    function nodeCountOf(md) {
      return md.split('\n').filter(l => /^(\s*[-*+]\s|#+\s+\S)/.test(l)).length;
    }
    function escapeHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function relativeTime(ts) {
      const diff = Date.now() - ts;
      if (diff < 60_000) return 'たった今';
      if (diff < 3600_000) return `${Math.floor(diff / 60_000)}分前`;
      if (diff < 86400_000) return `${Math.floor(diff / 3600_000)}時間前`;
      if (diff < 7 * 86400_000) return `${Math.floor(diff / 86400_000)}日前`;
      const d = new Date(ts);
      return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
    }
    function loadPrefs() {
      try {
        const raw = localStorage.getItem(PREFS_KEY);
        if (raw) return JSON.parse(raw);
      } catch {}
      return {};
    }
    function savePrefs(p) {
      try { localStorage.setItem(PREFS_KEY, JSON.stringify(p)); } catch {}
    }
    function loadLibrary() {
      try {
        const raw = localStorage.getItem(LIB_KEY);
        if (raw) {
          const lib = JSON.parse(raw);
          if (lib && Array.isArray(lib.maps) && lib.maps.length > 0) {
            if (!lib.maps.find(m => m.id === lib.currentId)) lib.currentId = lib.maps[0].id;
            return lib;
          }
        }
      } catch {}
      const legacy = localStorage.getItem(LEGACY_KEY);
      if (legacy) {
        const m = { id: freshId(), markdown: legacy, createdAt: nowTs(), updatedAt: nowTs() };
        const lib = { maps: [m], currentId: m.id };
        saveLibraryRaw(lib);
        return lib;
      }
      const m = { id: freshId(), markdown: SAMPLE, createdAt: nowTs(), updatedAt: nowTs() };
      const lib = { maps: [m], currentId: m.id };
      saveLibraryRaw(lib);
      return lib;
    }
    function saveLibraryRaw(lib) {
      try { localStorage.setItem(LIB_KEY, JSON.stringify(lib)); } catch {}
    }
    function saveLibrary() {
      if (mutedSave) return;
      saveLibraryRaw(library);
    }

    function setCurrentMap(map, opts = {}) {
      currentMap = map;
      library.currentId = map.id;
      mutedSave = true;
      editor.value = map.markdown;
      mutedSave = false;
      saveLibrary();
      render({ fit: true });
      updateHeaderTitle();
      renderSidebarList();
      // モバイルでサイドバーを閉じる
      if (window.innerWidth <= 768 && document.body.classList.contains('sidebar-shown')) {
        if (!opts.keepSidebar) closeSidebar();
      }
      // アクティブカードを見える位置にスクロール
      setTimeout(() => {
        const active = sbList.querySelector('.map-item.active');
        if (active) active.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }, 100);
    }

    function updateHeaderTitle() {
      if (!currentMap) return;
      const t = titleOf(currentMap.markdown);
      mapTitleEl.textContent = t;
      document.title = `${t} — MindMap`;
    }

    let saveStateTimer = null;
    function showSaving() {
      saveIndicator.classList.add('show');
      saveIndicator.classList.remove('saved');
      saveText.textContent = '保存中';
    }
    function showSaved() {
      saveIndicator.classList.add('show', 'saved');
      saveText.textContent = '保存しました';
      clearTimeout(saveStateTimer);
      saveStateTimer = setTimeout(() => saveIndicator.classList.remove('show'), 2000);
    }

    function flushCurrentMap() {
      if (!currentMap) return;
      const v = editor.value;
      if (v !== currentMap.markdown) {
        currentMap.markdown = v;
        currentMap.updatedAt = nowTs();
        saveLibrary();
        updateHeaderTitle();
        renderSidebarList();
        showSaved();
      }
    }

    function createNewMap(initialMd = null, opts = {}) {
      flushCurrentMap();
      const md = initialMd ?? BLANK_TEMPLATE;
      const m = { id: freshId(), markdown: md, createdAt: nowTs(), updatedAt: nowTs() };
      library.maps.unshift(m);
      setCurrentMap(m, opts);
      if (!opts.silent) toast('新しいマップを作成しました');
      // エディタにフォーカス
      setTimeout(() => { editor.focus(); editor.setSelectionRange(2, 2 + '新しいマップ'.length); }, 200);
    }

    function openMap(id) {
      const m = library.maps.find(x => x.id === id);
      if (!m) return false;
      flushCurrentMap();
      setCurrentMap(m);
      return true;
    }

    function duplicateMap(id) {
      const m = library.maps.find(x => x.id === id);
      if (!m) return;
      const t = titleOf(m.markdown);
      const newMd = m.markdown.replace(/^#\s+(.+?)\s*$/m, `# ${t}（コピー）`);
      const copy = { id: freshId(), markdown: newMd, createdAt: nowTs(), updatedAt: nowTs() };
      library.maps.unshift(copy);
      saveLibrary();
      renderSidebarList();
      toast('複製しました');
    }

    function renameMap(id) {
      const m = library.maps.find(x => x.id === id);
      if (!m) return;
      const currentTitle = titleOf(m.markdown);
      openDialog('マップ名を変更', currentTitle, (val) => {
        if (val === null || val === '' || val === currentTitle) return;
        // 最初の # 行を置き換え
        const lines = m.markdown.split('\n');
        let replaced = false;
        for (let i = 0; i < lines.length; i++) {
          if (/^#\s+\S/.test(lines[i])) {
            lines[i] = `# ${val.split('\n')[0]}`;
            replaced = true;
            break;
          }
        }
        if (!replaced) lines.unshift(`# ${val}`, '');
        m.markdown = lines.join('\n');
        m.updatedAt = nowTs();
        if (m.id === library.currentId) {
          mutedSave = true;
          editor.value = m.markdown;
          mutedSave = false;
          render();
          updateHeaderTitle();
        }
        saveLibrary();
        renderSidebarList();
        toast('名前を変更しました');
      });
    }

    function deleteMapConfirmed(id) {
      const idx = library.maps.findIndex(x => x.id === id);
      if (idx < 0) return;
      const wasCurrent = library.currentId === id;
      library.maps.splice(idx, 1);
      if (library.maps.length === 0) {
        const m = { id: freshId(), markdown: BLANK_TEMPLATE, createdAt: nowTs(), updatedAt: nowTs() };
        library.maps.push(m);
        library.currentId = m.id;
        if (wasCurrent) setCurrentMap(m, { keepSidebar: true });
        else saveLibrary();
      } else if (wasCurrent) {
        setCurrentMap(library.maps[0], { keepSidebar: true });
      } else {
        saveLibrary();
      }
      renderSidebarList();
      toast('削除しました');
    }

    // ════════════════════════════════════════════════════
    // 6. サイドバー
    // ════════════════════════════════════════════════════
    function openSidebar() {
      if (window.innerWidth <= 768) {
        document.body.classList.remove('sidebar-hidden');
        document.body.classList.add('sidebar-shown');
      } else {
        document.body.classList.remove('sidebar-hidden');
      }
      setTimeout(() => {
        const active = sbList.querySelector('.map-item.active');
        if (active) active.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        // PCではビューポートが変わったのでフィット
        if (window.innerWidth > 768) requestAnimationFrame(() => { resizeViewport(); applyTransform(); });
      }, 280);
    }
    function closeSidebar() {
      if (window.innerWidth <= 768) {
        document.body.classList.remove('sidebar-shown');
      } else {
        document.body.classList.add('sidebar-hidden');
      }
      setTimeout(() => {
        if (window.innerWidth > 768) requestAnimationFrame(() => { resizeViewport(); applyTransform(); });
      }, 280);
    }
    function toggleSidebar() {
      const isMobile = window.innerWidth <= 768;
      const isOpen = isMobile
        ? document.body.classList.contains('sidebar-shown')
        : !document.body.classList.contains('sidebar-hidden');
      if (isOpen) closeSidebar(); else openSidebar();
    }

    function applySidebarInitial() {
      // 初期：デスクトップ→表示、モバイル→非表示
      if (window.innerWidth <= 768) {
        document.body.classList.add('sidebar-hidden');
        document.body.classList.remove('sidebar-shown');
      } else {
        document.body.classList.remove('sidebar-hidden');
        document.body.classList.remove('sidebar-shown');
      }
    }

    function sortMaps(maps) {
      const m = [...maps];
      if (sortMode === 'updated') m.sort((a, b) => b.updatedAt - a.updatedAt);
      else if (sortMode === 'created') m.sort((a, b) => b.createdAt - a.createdAt);
      else if (sortMode === 'title') m.sort((a, b) => titleOf(a.markdown).localeCompare(titleOf(b.markdown), 'ja'));
      return m;
    }
    function filterMaps(maps) {
      if (!searchQuery.trim()) return maps;
      const q = searchQuery.trim().toLowerCase();
      return maps.filter(m =>
        titleOf(m.markdown).toLowerCase().includes(q) ||
        m.markdown.toLowerCase().includes(q)
      );
    }

    function renderSidebarList() {
      const all = library?.maps || [];
      sbCount.textContent = all.length;
      const filtered = filterMaps(all);
      const sorted = sortMaps(filtered);

      sbList.innerHTML = '';
      if (sorted.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'sb-empty';
        if (searchQuery.trim()) {
          empty.innerHTML = `<span class="icon">🔍</span>「${escapeHtml(searchQuery)}」に一致するマップがありません<br><br><button id="sb-clear-search" class="ghost" style="font-size:12px;">検索をクリア</button>`;
          setTimeout(() => {
            document.getElementById('sb-clear-search')?.addEventListener('click', () => {
              sbSearch.value = ''; searchQuery = ''; renderSidebarList();
            });
          }, 0);
        } else {
          empty.innerHTML = `<span class="icon">📭</span>まだマップがありません<br>「＋ 新規マップ」から始めてください`;
        }
        sbList.appendChild(empty);
        return;
      }

      for (const m of sorted) {
        const isActive = m.id === library.currentId;
        const t = titleOf(m.markdown);
        const nc = nodeCountOf(m.markdown);
        const rt = relativeTime(m.updatedAt);

        const item = document.createElement('div');
        item.className = 'map-item' + (isActive ? ' active' : '');
        item.setAttribute('data-id', m.id);
        item.setAttribute('role', 'button');
        item.setAttribute('tabindex', '0');
        item.innerHTML = `
          <div class="map-item-title">${escapeHtml(t)}</div>
          <div class="map-item-meta">
            <span>${escapeHtml(rt)}</span>
            <span class="sep">·</span>
            <span>${nc} ノード</span>
          </div>
          <button class="map-item-menu-btn" data-menu="${m.id}" aria-label="メニュー" title="メニュー">⋯</button>
        `;
        sbList.appendChild(item);
      }
    }

    // クリック：開く / メニュー
    sbList.addEventListener('click', (e) => {
      const menuBtn = e.target.closest('.map-item-menu-btn');
      if (menuBtn) {
        e.stopPropagation();
        const id = menuBtn.getAttribute('data-menu');
        showContextMenu(menuBtn, id);
        return;
      }
      const item = e.target.closest('.map-item');
      if (item) {
        const id = item.getAttribute('data-id');
        if (id === library.currentId) {
          // すでに開いてる→何もしない（だがモバイルではサイドバーを閉じる）
          if (window.innerWidth <= 768) closeSidebar();
          return;
        }
        openMap(id);
      }
    });

    // キーボード
    sbList.addEventListener('keydown', (e) => {
      const item = e.target.closest('.map-item');
      if (!item) return;
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        item.click();
      }
    });

    sbSearch.addEventListener('input', () => {
      searchQuery = sbSearch.value;
      renderSidebarList();
    });
    sbSort.addEventListener('change', () => {
      sortMode = sbSort.value;
      const p = loadPrefs(); p.sort = sortMode; savePrefs(p);
      renderSidebarList();
    });

    document.getElementById('sb-new').addEventListener('click', () => createNewMap());
    document.getElementById('sb-import').addEventListener('click', () => document.getElementById('file-input').click());
    document.getElementById('sb-export-all').addEventListener('click', exportAllToFolder);
    document.getElementById('sb-close').addEventListener('click', closeSidebar);
    document.getElementById('sb-backdrop').addEventListener('click', closeSidebar);
    document.getElementById('btn-sidebar').addEventListener('click', toggleSidebar);

    // ════════════════════════════════════════════════════
    // 7. コンテキストメニュー
    // ════════════════════════════════════════════════════
    let ctxOpenId = null;
    function showContextMenu(anchor, id) {
      const rect = anchor.getBoundingClientRect();
      ctxOpenId = id;
      ctxMenu.innerHTML = `
        <button data-act="rename"><span>✏️</span><span>名前を変更</span></button>
        <button data-act="duplicate"><span>📋</span><span>複製</span></button>
        <button data-act="export"><span>📁</span><span>ファイルに保存</span></button>
        <hr>
        <button data-act="delete" class="danger"><span>🗑️</span><span>削除</span></button>
      `;
      // 表示してサイズを取得
      ctxMenu.classList.add('open');
      const mw = ctxMenu.offsetWidth;
      const mh = ctxMenu.offsetHeight;
      let left = rect.right - mw;
      let top = rect.bottom + 4;
      if (left < 8) left = 8;
      if (top + mh > window.innerHeight - 8) top = rect.top - mh - 4;
      ctxMenu.style.left = left + 'px';
      ctxMenu.style.top = top + 'px';
    }
    function hideContextMenu() {
      ctxMenu.classList.remove('open');
      ctxOpenId = null;
    }
    ctxMenu.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-act]');
      if (!btn || !ctxOpenId) return;
      const act = btn.getAttribute('data-act');
      const id = ctxOpenId;
      hideContextMenu();
      const m = library.maps.find(x => x.id === id);
      if (!m) return;
      if (act === 'rename') renameMap(id);
      else if (act === 'duplicate') duplicateMap(id);
      else if (act === 'export') exportOneToFolder(m);
      else if (act === 'delete') {
        confirmAction('削除しますか？', `「${titleOf(m.markdown)}」を削除します。この操作は取り消せません。`, (ok) => {
          if (ok) deleteMapConfirmed(id);
        }, '削除する');
      }
    });
    document.addEventListener('click', (e) => {
      if (!ctxOpenId) return;
      if (e.target.closest('.ctx-menu')) return;
      if (e.target.closest('.map-item-menu-btn')) return;
      hideContextMenu();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && ctxOpenId) hideContextMenu();
    });

    // ════════════════════════════════════════════════════
    // 8. Markdownパーサ
    // ════════════════════════════════════════════════════
    function parseMarkdown(md) {
      const lines = md.split(/\r?\n/);
      let rootText = 'マインドマップ';
      const firstHeading = lines.find(l => /^#\s+\S/.test(l));
      if (firstHeading) rootText = firstHeading.replace(/^#\s+/, '').trim();
      let idCounter = 0;
      const root = { id: 'n' + (idCounter++), text: rootText, depth: 0, children: [], parent: null };
      const stack = [{ node: root, depth: 0 }];
      let firstHeadingConsumed = false;
      let headingBaseDepth = 0;
      let lastNode = null, lastIndentCol = 0;

      for (const raw of lines) {
        if (!raw.trim()) continue;
        if (/^#\s+\S/.test(raw) && !firstHeadingConsumed) {
          firstHeadingConsumed = true;
          lastNode = root; lastIndentCol = 2;
          continue;
        }
        const head = raw.match(/^(#{2,6})\s+(.+?)\s*$/);
        if (head) {
          const depth = head[1].length - 1;
          const node = { id: 'n' + (idCounter++), text: head[2].trim(), depth, children: [], parent: null };
          while (stack.length > 1 && stack[stack.length - 1].depth >= depth) stack.pop();
          const parent = stack[stack.length - 1].node;
          node.parent = parent; parent.children.push(node);
          stack.push({ node, depth });
          headingBaseDepth = depth;
          lastNode = node; lastIndentCol = head[1].length + 1;
          continue;
        }
        const bullet = raw.match(/^(\s*)([-*+])\s+(.+?)\s*$/);
        if (bullet) {
          const indentChars = bullet[1].replace(/\t/g, '  ');
          const indent = indentChars.length;
          const depth = headingBaseDepth + 1 + Math.floor(indent / 2);
          const node = { id: 'n' + (idCounter++), text: bullet[3].trim(), depth, children: [], parent: null };
          while (stack.length > 1 && stack[stack.length - 1].depth >= depth) stack.pop();
          const parent = stack[stack.length - 1].node;
          node.parent = parent; parent.children.push(node);
          stack.push({ node, depth });
          lastNode = node; lastIndentCol = indent + 2;
          continue;
        }
        const contMatch = raw.match(/^(\s+)(\S.*?)\s*$/);
        if (contMatch && lastNode) {
          const indentChars = contMatch[1].replace(/\t/g, '  ');
          if (indentChars.length >= lastIndentCol) {
            lastNode.text += '\n' + contMatch[2];
            continue;
          }
        }
      }
      return root;
    }

    function treeToMarkdown(root) {
      const lines = [];
      const rootLines = root.text.split('\n');
      lines.push(`# ${rootLines[0]}`);
      for (let i = 1; i < rootLines.length; i++) lines.push(`  ${rootLines[i]}`);
      lines.push('');
      function walk(node, depth) {
        const indent = '  '.repeat(depth - 1);
        const contIndent = indent + '  ';
        const tLines = node.text.split('\n');
        lines.push(`${indent}- ${tLines[0]}`);
        for (let i = 1; i < tLines.length; i++) lines.push(`${contIndent}${tLines[i]}`);
        node.children.forEach(c => walk(c, depth + 1));
      }
      root.children.forEach(c => walk(c, 1));
      return lines.join('\n') + '\n';
    }

    function flatten(root) { const out = []; (function w(n){ out.push(n); n.children.forEach(w); })(root); return out; }
    function findById(id) { return allNodes.find(n => n.id === id); }
    function isDescendant(maybeDesc, ancestor) {
      let p = maybeDesc; while (p) { if (p === ancestor) return true; p = p.parent; } return false;
    }

    // ════════════════════════════════════════════════════
    // 9. テキスト計測 & レイアウト
    // ════════════════════════════════════════════════════
    function measureText(text, fontSize, weight) {
      const t = document.createElementNS(SVG_NS, 'text');
      t.setAttribute('font-size', fontSize);
      t.setAttribute('font-weight', weight);
      t.setAttribute('font-family', 'system-ui, -apple-system, "Hiragino Kaku Gothic ProN", sans-serif');
      t.style.visibility = 'hidden';
      t.textContent = text;
      svg.appendChild(t);
      const w = t.getBBox().width;
      svg.removeChild(t);
      return w;
    }

    const X_GAP = 60, Y_GAP = 12, PAD = 32;
    const contentBounds = { minX: 0, minY: 0, maxX: 0, maxY: 0 };

    function computeLayout() {
      allNodes.forEach(n => {
        const isRoot = n.depth === 0;
        n.fontSize = isRoot ? 18 : (n.depth === 1 ? 15 : 13);
        n.weight = isRoot ? 700 : (n.depth === 1 ? 600 : 500);
        const rawLines = n.text.split('\n');
        n.lines = rawLines.length > 0 ? rawLines : [''];
        let maxW = 0;
        n.lines.forEach(line => {
          const w = measureText(line || ' ', n.fontSize, n.weight);
          if (w > maxW) maxW = w;
        });
        n.lineHeight = n.fontSize * 1.35;
        n.boxW = Math.max(48, maxW + 28);
        const padV = isRoot ? 14 : (n.depth === 1 ? 12 : 10);
        const textH = n.lines.length * n.lineHeight;
        const minH = isRoot ? 44 : (n.depth === 1 ? 36 : 30);
        n.boxH = Math.max(minH, textH + padV);
      });

      function layoutY(node, top) {
        if (node.children.length === 0) {
          node.top = top; node.cy = top + node.boxH / 2;
          return top + node.boxH + Y_GAP;
        }
        let cursor = top;
        node.children.forEach(c => { cursor = layoutY(c, cursor); });
        const f = node.children[0], l = node.children[node.children.length - 1];
        node.cy = (f.cy + l.cy) / 2;
        node.top = node.cy - node.boxH / 2;
        return Math.max(cursor, node.top + node.boxH + Y_GAP);
      }
      function layoutX(node, left) {
        node.left = left; node.cx = left + node.boxW / 2;
        const childLeft = left + node.boxW + X_GAP;
        node.children.forEach(c => layoutX(c, childLeft));
      }
      layoutY(tree, PAD);
      layoutX(tree, PAD);

      contentBounds.minX = Math.min(...allNodes.map(n => n.left));
      contentBounds.minY = Math.min(...allNodes.map(n => n.top));
      contentBounds.maxX = Math.max(...allNodes.map(n => n.left + n.boxW));
      contentBounds.maxY = Math.max(...allNodes.map(n => n.top + n.boxH));
    }

    // ════════════════════════════════════════════════════
    // 10. SVGビューポート
    // ════════════════════════════════════════════════════
    function resizeViewport() {
      const r = svg.getBoundingClientRect();
      const w = Math.max(1, r.width), h = Math.max(1, r.height);
      svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    }
    function applyTransform() {
      if (!canvasG) return;
      canvasG.setAttribute('transform', `translate(${view.tx},${view.ty}) scale(${view.scale})`);
      document.getElementById('zoom-level').textContent = `${Math.round(view.scale * 100)}%`;
    }
    function clientToWorld(cx, cy) {
      const r = svg.getBoundingClientRect();
      return { x: (cx - r.left - view.tx) / view.scale, y: (cy - r.top - view.ty) / view.scale };
    }
    function fitContent() {
      if (!tree) return;
      resizeViewport();
      const r = svg.getBoundingClientRect();
      const cw = contentBounds.maxX - contentBounds.minX + PAD * 2;
      const ch = contentBounds.maxY - contentBounds.minY + PAD * 2;
      const m = 24;
      const sx = (r.width - m * 2) / cw;
      const sy = (r.height - m * 2) / ch;
      const s = Math.min(sx, sy, 1.2);
      view.scale = s;
      view.tx = (r.width - cw * s) / 2 - (contentBounds.minX - PAD) * s;
      view.ty = (r.height - ch * s) / 2 - (contentBounds.minY - PAD) * s;
      applyTransform();
    }

    // ════════════════════════════════════════════════════
    // 11. レンダリング
    // ════════════════════════════════════════════════════
    function el(tag, attrs) {
      const e = document.createElementNS(SVG_NS, tag);
      for (const k in attrs) e.setAttribute(k, attrs[k]);
      return e;
    }

    function render(opts = {}) {
      tree = parseMarkdown(editor.value);
      allNodes = flatten(tree);
      computeLayout();
      resizeViewport();
      svg.innerHTML = '';
      canvasG = el('g', { id: 'canvas' });
      svg.appendChild(canvasG);
      applyTransform();

      allNodes.forEach(parent => {
        parent.children.forEach(child => {
          const x1 = parent.left + parent.boxW, y1 = parent.cy;
          const x2 = child.left, y2 = child.cy;
          const mx = (x1 + x2) / 2;
          canvasG.appendChild(el('path', {
            d: `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`,
            stroke: colorFor(child.depth),
            'stroke-width': child.depth <= 1 ? 2.5 : 2,
            fill: 'none', opacity: 0.5,
          }));
        });
      });

      allNodes.forEach(n => {
        const g = el('g', { class: 'node', 'data-id': n.id });
        if (selectedNodeId === n.id) g.setAttribute('class', 'node selected');
        const radius = n.lines.length > 1 ? Math.min(14, n.boxH / 4) : n.boxH / 2;
        g.appendChild(el('rect', {
          class: 'node-bg',
          x: n.left, y: n.top, width: n.boxW, height: n.boxH,
          rx: radius, ry: radius,
          fill: colorFor(n.depth),
        }));
        const text = el('text', {
          'text-anchor': 'middle',
          fill: '#fff', 'font-size': n.fontSize, 'font-weight': n.weight,
          'font-family': 'system-ui, -apple-system, "Hiragino Kaku Gothic ProN", sans-serif',
          'pointer-events': 'none',
        });
        const firstLineY = n.cy - (n.lines.length - 1) / 2 * n.lineHeight;
        n.lines.forEach((line, i) => {
          const tspan = document.createElementNS(SVG_NS, 'tspan');
          tspan.setAttribute('x', n.cx);
          tspan.setAttribute('y', firstLineY + i * n.lineHeight);
          tspan.setAttribute('dominant-baseline', 'central');
          tspan.textContent = line || ' ';
          text.appendChild(tspan);
        });
        g.appendChild(text);

        const plusCx = n.left + n.boxW + 14, plusCy = n.cy;
        const addG = el('g', { class: 'add-btn', 'data-add': n.id });
        addG.appendChild(el('circle', { cx: plusCx, cy: plusCy, r: 10, fill: '#fff', stroke: colorFor(n.depth), 'stroke-width': 1.5 }));
        const plus = el('text', {
          x: plusCx, y: plusCy + 0.5,
          'text-anchor': 'middle', 'dominant-baseline': 'central',
          fill: colorFor(n.depth), 'font-size': 14, 'font-weight': 700,
          'pointer-events': 'none',
        });
        plus.textContent = '+';
        addG.appendChild(plus);
        g.appendChild(addG);

        canvasG.appendChild(g);
      });

      document.getElementById('node-count').textContent = `${allNodes.length} ノード`;
      document.getElementById('char-count').textContent = `${editor.value.length} 文字`;
      if (opts.fit) fitContent();
    }

    // ════════════════════════════════════════════════════
    // 12. ノード編集
    // ════════════════════════════════════════════════════
    function editNode(id) {
      const node = findById(id); if (!node) return;
      const title = node === tree ? 'タイトルを編集（改行OK）' : 'ノードを編集（改行OK／空欄で削除）';
      openDialog(title, node.text, (val) => {
        if (val === null) return;
        if (val === '' && node !== tree) {
          const p = node.parent;
          p.children = p.children.filter(c => c !== node);
        } else if (val !== '') {
          node.text = val;
        }
        editor.value = treeToMarkdown(tree);
        flushCurrentMap();
        render();
      });
    }
    function addChild(parentId, text) {
      const p = findById(parentId); if (!p) return;
      p.children.push({ id: 'tmp', text, depth: p.depth + 1, children: [], parent: p });
      editor.value = treeToMarkdown(tree);
      flushCurrentMap();
      render();
    }
    function reparent(nodeId, newParentId) {
      if (nodeId === newParentId) return false;
      const node = findById(nodeId), np = findById(newParentId);
      if (!node || !np || !node.parent) return false;
      if (isDescendant(np, node)) return false;
      if (node.parent === np) return false;
      node.parent.children = node.parent.children.filter(c => c !== node);
      np.children.push(node);
      node.parent = np;
      editor.value = treeToMarkdown(tree);
      flushCurrentMap();
      return true;
    }

    // ════════════════════════════════════════════════════
    // 13. ダイアログ
    // ════════════════════════════════════════════════════
    const dlg = document.getElementById('dialog-edit');
    const dlgInput = document.getElementById('dialog-input');
    const dlgTitle = document.getElementById('dialog-title');
    let dlgCallback = null;
    function openDialog(title, value, cb) {
      dlgTitle.textContent = title;
      dlgInput.value = value;
      dlgCallback = cb;
      document.getElementById('dialog-char-count').textContent = `${value.length} 文字`;
      if (typeof dlg.showModal === 'function') dlg.showModal();
      dlgInput.style.height = 'auto';
      dlgInput.style.height = Math.min(Math.max(dlgInput.scrollHeight + 4, 56), window.innerHeight * 0.5) + 'px';
      setTimeout(() => { dlgInput.focus(); dlgInput.select(); }, 50);
    }
    function normalizeDialogValue(raw) {
      return raw.split('\n').map(l => l.replace(/[ \t]+$/, '')).join('\n').trim();
    }
    document.getElementById('dialog-ok').addEventListener('click', () => {
      const v = normalizeDialogValue(dlgInput.value); dlg.close();
      if (dlgCallback) dlgCallback(v);
    });
    document.getElementById('dialog-cancel').addEventListener('click', () => {
      dlg.close(); if (dlgCallback) dlgCallback(null);
    });
    dlgInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
        e.preventDefault(); document.getElementById('dialog-ok').click();
      }
      if (e.key === 'Escape') {
        e.preventDefault(); document.getElementById('dialog-cancel').click();
      }
    });
    dlgInput.addEventListener('input', () => {
      document.getElementById('dialog-char-count').textContent = `${dlgInput.value.length} 文字`;
      dlgInput.style.height = 'auto';
      dlgInput.style.height = Math.min(dlgInput.scrollHeight + 4, window.innerHeight * 0.5) + 'px';
    });

    const confirmDlg = document.getElementById('dialog-confirm');
    let confirmCallback = null;
    function confirmAction(title, msg, cb, okLabel = 'OK') {
      document.getElementById('confirm-title').textContent = title;
      document.getElementById('confirm-msg').textContent = msg;
      const okBtn = document.getElementById('confirm-ok');
      okBtn.textContent = okLabel;
      okBtn.classList.toggle('danger', okLabel === '削除する');
      confirmCallback = cb;
      if (typeof confirmDlg.showModal === 'function') confirmDlg.showModal();
    }
    document.getElementById('confirm-ok').addEventListener('click', () => {
      confirmDlg.close(); if (confirmCallback) confirmCallback(true);
    });
    document.getElementById('confirm-cancel').addEventListener('click', () => {
      confirmDlg.close(); if (confirmCallback) confirmCallback(false);
    });

    // ════════════════════════════════════════════════════
    // 14. ポインター操作（pan, ノードdrag, pinch）
    // ════════════════════════════════════════════════════
    const DRAG_THRESHOLD = 5;
    function svgPointFromClient(cx, cy) {
      const r = svg.getBoundingClientRect();
      return { x: cx - r.left, y: cy - r.top };
    }
    function nodeIdFromEvent(t) { const g = t.closest && t.closest('.node'); return g ? g.getAttribute('data-id') : null; }
    function addBtnIdFromEvent(t) { const g = t.closest && t.closest('.add-btn'); return g ? g.getAttribute('data-add') : null; }

    function onPointerDown(e) {
      if (e.button && e.button !== 0) return;
      try { svg.setPointerCapture(e.pointerId); } catch {}
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (pointers.size === 2 && dragState?.type !== 'node-drag') {
        const [a, b] = [...pointers.values()];
        dragState = { type: 'pinch', startDist: Math.hypot(a.x - b.x, a.y - b.y), startScale: view.scale };
        svg.classList.remove('panning');
        return;
      }

      const addId = addBtnIdFromEvent(e.target);
      if (addId) {
        e.preventDefault(); e.stopPropagation();
        openDialog('子ノードを追加（改行OK）', '', (val) => { if (val) addChild(addId, val); });
        pointers.delete(e.pointerId);
        return;
      }

      const nodeId = nodeIdFromEvent(e.target);
      if (nodeId) {
        dragState = { type: 'node-press', nodeId, startX: e.clientX, startY: e.clientY };
      } else {
        dragState = { type: 'pan', startX: e.clientX, startY: e.clientY, startTx: view.tx, startTy: view.ty };
        svg.classList.add('panning');
      }
    }
    function onPointerMove(e) {
      if (!pointers.has(e.pointerId)) return;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (dragState?.type === 'pinch' && pointers.size >= 2) {
        const [a, b] = [...pointers.values()].slice(0, 2);
        const d = Math.hypot(a.x - b.x, a.y - b.y);
        if (d > 0 && dragState.startDist > 0) {
          const factor = d / dragState.startDist;
          const mid = svgPointFromClient((a.x + b.x) / 2, (a.y + b.y) / 2);
          const newScale = Math.max(0.15, Math.min(4, dragState.startScale * factor));
          const wx = (mid.x - view.tx) / view.scale;
          const wy = (mid.y - view.ty) / view.scale;
          view.tx = mid.x - wx * newScale;
          view.ty = mid.y - wy * newScale;
          view.scale = newScale;
          applyTransform();
        }
        return;
      }

      if (!dragState) return;
      const dx = e.clientX - dragState.startX;
      const dy = e.clientY - dragState.startY;
      const dist = Math.hypot(dx, dy);

      if (dragState.type === 'pan') {
        view.tx = dragState.startTx + dx;
        view.ty = dragState.startTy + dy;
        applyTransform();
        return;
      }
      if (dragState.type === 'node-press' && dist > DRAG_THRESHOLD) {
        dragState.type = 'node-drag';
        const node = findById(dragState.nodeId);
        if (node === tree) { dragState = null; return; }
        svg.classList.add('node-dragging');
        const srcEl = canvasG.querySelector(`.node[data-id="${node.id}"]`);
        if (srcEl) srcEl.classList.add('drag-source');
        createDragGhost(node);
      }
      if (dragState.type === 'node-drag') {
        updateDragGhost(e.clientX, e.clientY);
        const t = hitTestNode(e.clientX, e.clientY, dragState.nodeId);
        canvasG.querySelectorAll('.node.drop-target').forEach(n => n.classList.remove('drop-target'));
        if (t) { canvasG.querySelector(`.node[data-id="${t.id}"]`)?.classList.add('drop-target'); dragState.target = t; }
        else { dragState.target = null; }
      }
    }
    function onPointerUp(e) {
      pointers.delete(e.pointerId);
      if (dragState?.type === 'pinch') { if (pointers.size < 2) dragState = null; return; }
      if (!dragState) { svg.classList.remove('panning', 'node-dragging'); return; }
      if (dragState.type === 'node-press') {
        const id = dragState.nodeId; dragState = null;
        if (id) editNode(id);
      } else if (dragState.type === 'node-drag') {
        const { nodeId, target } = dragState;
        cleanupDragVisuals(); dragState = null;
        if (target && reparent(nodeId, target.id)) {
          render(); toast('移動しました');
        } else if (target) { toast('そこへは移動できません', true); }
      } else if (dragState.type === 'pan') {
        dragState = null; svg.classList.remove('panning');
      }
    }
    function cleanupDragVisuals() {
      svg.classList.remove('node-dragging', 'panning');
      canvasG.querySelectorAll('.node.drop-target, .node.drag-source')
        .forEach(n => n.classList.remove('drop-target', 'drag-source'));
      if (ghostG && ghostG.parentNode) ghostG.parentNode.removeChild(ghostG);
      ghostG = null;
    }
    function hitTestNode(cx, cy, excludeId) {
      const els = document.elementsFromPoint(cx, cy);
      const exclude = findById(excludeId);
      for (const el of els) {
        if (!el.closest) continue;
        const g = el.closest('.node');
        if (!g) continue;
        const id = g.getAttribute('data-id');
        if (!id || id === excludeId) continue;
        const n = findById(id);
        if (!n) continue;
        if (exclude && isDescendant(n, exclude)) continue;
        return n;
      }
      return null;
    }
    function createDragGhost(node) {
      ghostG = el('g', { class: 'drag-ghost', opacity: 0.85 });
      const radius = node.lines.length > 1 ? Math.min(14, node.boxH / 4) : node.boxH / 2;
      ghostG.appendChild(el('rect', {
        x: node.left, y: node.top, width: node.boxW, height: node.boxH,
        rx: radius, ry: radius,
        fill: colorFor(node.depth),
        stroke: '#0f172a', 'stroke-width': 2,
        filter: 'drop-shadow(0 4px 8px rgba(0,0,0,0.25))',
      }));
      const text = el('text', {
        'text-anchor': 'middle',
        fill: '#fff', 'font-size': node.fontSize, 'font-weight': node.weight,
        'font-family': 'system-ui, -apple-system, sans-serif',
      });
      const firstLineY = node.cy - (node.lines.length - 1) / 2 * node.lineHeight;
      node.lines.forEach((line, i) => {
        const tspan = document.createElementNS(SVG_NS, 'tspan');
        tspan.setAttribute('x', node.cx);
        tspan.setAttribute('y', firstLineY + i * node.lineHeight);
        tspan.setAttribute('dominant-baseline', 'central');
        tspan.textContent = line || ' ';
        text.appendChild(tspan);
      });
      ghostG.appendChild(text);
      canvasG.appendChild(ghostG);
      ghostG._anchor = { x: node.left + node.boxW / 2, y: node.cy };
    }
    function updateDragGhost(cx, cy) {
      if (!ghostG) return;
      const w = clientToWorld(cx, cy);
      const a = ghostG._anchor;
      ghostG.setAttribute('transform', `translate(${w.x - a.x}, ${w.y - a.y})`);
    }
    function onWheel(e) {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
      zoomAt(e.clientX, e.clientY, factor);
    }
    function zoomAt(cx, cy, factor) {
      const p = svgPointFromClient(cx, cy);
      const wx = (p.x - view.tx) / view.scale;
      const wy = (p.y - view.ty) / view.scale;
      const newScale = Math.max(0.15, Math.min(4, view.scale * factor));
      view.tx = p.x - wx * newScale;
      view.ty = p.y - wy * newScale;
      view.scale = newScale;
      applyTransform();
    }
    function zoomCentered(factor) {
      const r = svg.getBoundingClientRect();
      zoomAt(r.left + r.width / 2, r.top + r.height / 2, factor);
    }

    svg.addEventListener('pointerdown', onPointerDown);
    svg.addEventListener('pointermove', onPointerMove);
    svg.addEventListener('pointerup', onPointerUp);
    svg.addEventListener('pointercancel', onPointerUp);
    svg.addEventListener('lostpointercapture', onPointerUp);
    svg.addEventListener('wheel', onWheel, { passive: false });
    svg.addEventListener('contextmenu', (e) => e.preventDefault());

    // ════════════════════════════════════════════════════
    // 15. テキスト入力支援
    // ════════════════════════════════════════════════════
    function getLineRange(text, pos) {
      const start = text.lastIndexOf('\n', pos - 1) + 1;
      let end = text.indexOf('\n', pos);
      if (end === -1) end = text.length;
      return { start, end };
    }
    function handleEnterKey(e) {
      const pos = editor.selectionStart;
      if (pos !== editor.selectionEnd) return false;
      const v = editor.value;
      const { start } = getLineRange(v, pos);
      const lineUpToCaret = v.slice(start, pos);
      const m = lineUpToCaret.match(/^(\s*)([-*+])\s+(.*)$/);
      if (!m) return false;
      const [, indent, bullet, content] = m;
      e.preventDefault();
      if (content.trim() === '') {
        if (indent.length >= 2) {
          const newIndent = indent.slice(0, -2);
          const newLine = `${newIndent}${bullet} `;
          editor.value = v.slice(0, start) + newLine + v.slice(pos);
          editor.selectionStart = editor.selectionEnd = start + newLine.length;
        } else {
          editor.value = v.slice(0, start) + '\n' + v.slice(pos);
          editor.selectionStart = editor.selectionEnd = start + 1;
        }
      } else {
        const insert = `\n${indent}${bullet} `;
        editor.value = v.slice(0, pos) + insert + v.slice(pos);
        editor.selectionStart = editor.selectionEnd = pos + insert.length;
      }
      scheduleRender();
      return true;
    }
    function handleIndent(direction) {
      const v = editor.value;
      const selStart = editor.selectionStart, selEnd = editor.selectionEnd;
      const rangeStart = v.lastIndexOf('\n', selStart - 1) + 1;
      const rangeEndN = v.indexOf('\n', selEnd);
      const rangeEnd = rangeEndN === -1 ? v.length : rangeEndN;
      const block = v.slice(rangeStart, rangeEnd);
      const lines = block.split('\n');
      const transformed = lines.map(line => {
        if (direction > 0) return '  ' + line;
        if (line.startsWith('  ')) return line.slice(2);
        if (line.startsWith('\t')) return line.slice(1);
        return line;
      }).join('\n');
      editor.value = v.slice(0, rangeStart) + transformed + v.slice(rangeEnd);
      const indentEach = direction > 0 ? 2 : -2;
      const lineCount = lines.length;
      editor.selectionStart = Math.max(rangeStart, selStart + indentEach);
      editor.selectionEnd = Math.max(rangeStart, selEnd + indentEach * lineCount);
      scheduleRender();
    }
    function handleNewBullet(asChild = false) {
      const v = editor.value;
      const pos = editor.selectionStart;
      const { start, end } = getLineRange(v, pos);
      const line = v.slice(start, end);
      const m = line.match(/^(\s*)([-*+])\s+/);
      const indent = m ? m[1] : '';
      const bullet = m ? m[2] : '-';
      const newIndent = asChild ? indent + '  ' : indent;
      const insert = (end > start ? '\n' : '') + `${newIndent}${bullet} `;
      editor.value = v.slice(0, end) + insert + v.slice(end);
      const caret = end + insert.length;
      editor.selectionStart = editor.selectionEnd = caret;
      editor.focus();
      scheduleRender();
    }
    editor.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey && !e.metaKey && !e.ctrlKey) { if (handleEnterKey(e)) return; }
      if (e.key === 'Tab') { e.preventDefault(); handleIndent(e.shiftKey ? -1 : 1); }
    });
    document.querySelector('.editor-toolbar').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-action]'); if (!btn) return;
      const action = btn.getAttribute('data-action');
      editor.focus();
      if (action === 'indent') handleIndent(1);
      else if (action === 'outdent') handleIndent(-1);
      else if (action === 'newbullet') handleNewBullet(false);
      else if (action === 'newchild') handleNewBullet(true);
    });

    let renderTimer = null;
    function scheduleRender() {
      clearTimeout(renderTimer);
      showSaving();
      renderTimer = setTimeout(() => { render(); flushCurrentMap(); }, 80);
    }
    editor.addEventListener('input', scheduleRender);

    // ════════════════════════════════════════════════════
    // 16. 共有URL / .md
    // ════════════════════════════════════════════════════
    function copyShareUrl() {
      const md = editor.value;
      const compressed = LZString.compressToEncodedURIComponent(md);
      const url = `${location.origin}${location.pathname}#${compressed}`;
      const sizeKb = Math.round(compressed.length / 1024 * 10) / 10;
      const fallback = () => prompt('このURLをコピーしてください', url);
      if (navigator.clipboard?.writeText) {
        navigator.clipboard.writeText(url).then(
          () => toast(`共有URLをコピーしました（${sizeKb}KB）`), fallback
        );
      } else fallback();
    }
    function loadFromHash() {
      if (location.hash.length > 1) {
        const md = LZString.decompressFromEncodedURIComponent(location.hash.slice(1));
        if (md && md.length > 0) return md;
      }
      return null;
    }
    function safeFileName(t) {
      return (t || 'mindmap').replace(/[\s\/\\:*?"<>|]+/g, '_').slice(0, 40) || 'mindmap';
    }
    function downloadMarkdownFor(map) {
      const md = map.markdown;
      const title = safeFileName(titleOf(md));
      const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${title}.md`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      toast(`${a.download} を保存しました`);
    }

    function fsSupportsSave() { return typeof window.showSaveFilePicker === 'function'; }
    function fsSupportsDirectory() { return typeof window.showDirectoryPicker === 'function'; }

    async function exportOneToFolder(map) {
      const title = safeFileName(titleOf(map.markdown));
      if (!fsSupportsSave()) { downloadMarkdownFor(map); return; }
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: `${title}.md`,
          types: [{ description: 'Markdown', accept: { 'text/markdown': ['.md'] } }]
        });
        const writable = await handle.createWritable();
        await writable.write(map.markdown);
        await writable.close();
        toast(`${handle.name} を保存しました`);
      } catch (e) {
        if (e.name !== 'AbortError') toast('保存に失敗: ' + (e.message || e.name), true);
      }
    }
    async function exportAllToFolder() {
      if (!fsSupportsDirectory()) {
        if (!confirm(`このブラウザはフォルダ書き出し非対応です。\n${library.maps.length}個のマップを連続でダウンロードしますか？`)) return;
        for (const m of library.maps) downloadMarkdownFor(m);
        return;
      }
      try {
        const dir = await window.showDirectoryPicker({ mode: 'readwrite' });
        let ok = 0;
        for (const m of library.maps) {
          const title = safeFileName(titleOf(m.markdown));
          const fileName = `${title}_${m.id.slice(2, 10)}.md`;
          const fh = await dir.getFileHandle(fileName, { create: true });
          const w = await fh.createWritable();
          await w.write(m.markdown);
          await w.close();
          ok++;
        }
        toast(`「${dir.name}」に ${ok} 個のマップを書き出しました`);
      } catch (e) {
        if (e.name !== 'AbortError') toast('書き出し失敗: ' + (e.message || e.name), true);
      }
    }

    // ════════════════════════════════════════════════════
    // 17. ヘッダーボタン
    // ════════════════════════════════════════════════════
    document.getElementById('btn-new').addEventListener('click', () => createNewMap());
    document.getElementById('btn-share').addEventListener('click', copyShareUrl);
    document.getElementById('btn-toggle').addEventListener('click', () => {
      if (main.classList.contains('view-editor')) {
        main.classList.remove('view-editor'); main.classList.add('view-mindmap');
        requestAnimationFrame(() => fitContent());
      } else if (main.classList.contains('view-mindmap')) {
        main.classList.remove('view-mindmap'); main.classList.add('view-split');
        requestAnimationFrame(() => fitContent());
      } else {
        main.classList.remove('view-split'); main.classList.add('view-editor');
      }
    });
    document.getElementById('btn-zoom-in').addEventListener('click', () => zoomCentered(1.2));
    document.getElementById('btn-zoom-out').addEventListener('click', () => zoomCentered(1 / 1.2));
    document.getElementById('btn-zoom-fit').addEventListener('click', () => { fitContent(); toast('全体を表示'); });

    mapTitleEl.addEventListener('click', () => {
      if (!tree) return;
      editNode(tree.id);
    });

    // ════════════════════════════════════════════════════
    // 18. ファイル取り込み
    // ════════════════════════════════════════════════════
    document.getElementById('file-input').addEventListener('change', (e) => {
      const files = e.target.files; if (!files || files.length === 0) return;
      let imported = 0;
      let lastMap = null;
      let pending = files.length;
      for (const f of files) {
        const r = new FileReader();
        r.onload = () => {
          const md = String(r.result);
          flushCurrentMap();
          const m = { id: freshId(), markdown: md, createdAt: nowTs(), updatedAt: nowTs() };
          library.maps.unshift(m);
          imported++;
          lastMap = m;
          pending--;
          if (pending === 0) {
            saveLibrary();
            if (lastMap) setCurrentMap(lastMap);
            renderSidebarList();
            toast(`${imported} 個のマップを取り込みました`);
          }
        };
        r.readAsText(f);
      }
      e.target.value = '';
    });

    // ════════════════════════════════════════════════════
    // 19. トースト
    // ════════════════════════════════════════════════════
    let toastTimer = null;
    function toast(msg, isError = false) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.background = isError ? 'var(--danger)' : 'var(--c0)';
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
    }

    // ════════════════════════════════════════════════════
    // 20. キーボードショートカット
    // ════════════════════════════════════════════════════
    document.addEventListener('keydown', (e) => {
      // ダイアログ表示中はスルー
      if (document.querySelector('dialog[open]')) return;
      // テキスト入力中の場合、特定のショートカットのみ
      const isEditing = e.target === editor || e.target === dlgInput || e.target === sbSearch;
      if ((e.metaKey || e.ctrlKey)) {
        if (e.key === 'n' || e.key === 'N') {
          e.preventDefault();
          createNewMap();
        } else if (e.key === '\\') {
          e.preventDefault();
          toggleSidebar();
        } else if (e.key === 'f' || e.key === 'F') {
          if (!isEditing) {
            e.preventDefault();
            openSidebar();
            setTimeout(() => sbSearch.focus(), 320);
          }
        }
      }
    });

    // ════════════════════════════════════════════════════
    // 21. リサイズ・ハッシュ・終了
    // ════════════════════════════════════════════════════
    window.addEventListener('resize', () => { resizeViewport(); applyTransform(); });
    window.addEventListener('hashchange', () => { tryAcceptHash({ silent: false }); });
    window.addEventListener('beforeunload', () => flushCurrentMap());

    function tryAcceptHash(opts = {}) {
      const md = loadFromHash();
      if (!md) return false;
      const dup = library.maps.find(m => m.markdown === md);
      if (dup) {
        flushCurrentMap();
        setCurrentMap(dup);
        if (!opts.silent) toast('共有URLのマップを開きました（既に保有）');
      } else {
        flushCurrentMap();
        const m = { id: freshId(), markdown: md, createdAt: nowTs(), updatedAt: nowTs() };
        library.maps.unshift(m);
        setCurrentMap(m);
        if (!opts.silent) toast('共有URLからライブラリに追加しました');
      }
      history.replaceState(null, '', location.pathname + location.search);
      return true;
    }

    // ════════════════════════════════════════════════════
    // 22. 起動
    // ════════════════════════════════════════════════════
    (function boot() {
      library = loadLibrary();
      const prefs = loadPrefs();
      if (prefs.sort) { sortMode = prefs.sort; sbSort.value = prefs.sort; }
      applySidebarInitial();

      const hadHash = location.hash.length > 1;
      if (hadHash) {
        const c = library.maps.find(m => m.id === library.currentId) || library.maps[0];
        currentMap = c;
        mutedSave = true; editor.value = c.markdown; mutedSave = false;
        tryAcceptHash({ silent: false });
      } else {
        const c = library.maps.find(m => m.id === library.currentId) || library.maps[0];
        setCurrentMap(c, { keepSidebar: true });
      }
      renderSidebarList();
      requestAnimationFrame(() => {
        render();
        requestAnimationFrame(() => fitContent());
      });
    })();

    // 相対時刻を定期更新
    setInterval(() => renderSidebarList(), 60_000);

  </script>
</body>
</html>
